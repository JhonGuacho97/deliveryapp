plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services" apply false
    id "dev.flutter.flutter-gradle-plugin"
}

// Only use Firebase resources registered for this application's identity.
def deliveryApplicationId = 'com.deliveryapp.mobile'
def firebaseFile = file('google-services.json')
def firebaseMatches = firebaseFile.exists() &&
    new groovy.json.JsonSlurper().parse(firebaseFile).client?.any {
        it.client_info?.android_client_info?.package_name == deliveryApplicationId
    }
if (firebaseMatches) {
    apply plugin: 'com.google.gms.google-services'
} else if (firebaseFile.exists()) {
    logger.warn('Firebase configuration does not match the application ID; using the offline profile. Configure your own Firebase Android application to enable external services.')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def mapsProperties = new Properties()
def mapsPropertiesFile = rootProject.file('maps.properties')
if (mapsPropertiesFile.exists()) {
    mapsPropertiesFile.withReader('UTF-8') { reader -> mapsProperties.load(reader) }
}
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36
    namespace deliveryApplicationId
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId deliveryApplicationId
        manifestPlaceholders += [MAPS_API_KEY: System.getenv('MAPS_API_KEY') ?: mapsProperties.getProperty('MAPS_API_KEY', '')]
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
}
